name: Checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: korum_test
          POSTGRES_PASSWORD: korum_test
          POSTGRES_DB: postgres
        ports:
          - 16482:5432
        options: >-
          --health-cmd "pg_isready -U korum_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7
        ports:
          - 16481:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      KORUM_TEST_DATABASE_URL: postgres://korum_test:korum_test@127.0.0.1:16482/postgres
      KORUM_TEST_REDIS_URL: redis://127.0.0.1:16481
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.18.0
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run test:all
      - run: npm run build
