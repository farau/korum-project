name: korum-robinhood-testnet-indexer
resource_size: s

sources:
  # Renaming the source resets its checkpoint so historical Core/Hook events
  # are backfilled after expanding the contract-address filter.
  korum_deployment_v2_logs:
    type: dataset
    dataset_name: robinhood_testnet.raw_logs
    version: 1.1.0
    primary_key: id
    start_at: earliest
    filter: >-
      block_number >= 123181130
      AND address IN (
        '0x771735be66ba0e4dce80e1f120fae539810e7691',
        '0x4be4652a39299a82f1b459534984931aff52da12',
        '0xc0c5db0dfe3e115489f9733afe1c7a11119ae0cc',
        '0x4cab1f34bf69337dafdbdbb2184519bb804fa5f6'
      )

transforms:
  decoded_korum_events:
    type: sql
    primary_key: id
    sql: |
      SELECT
        _gs_log_decode('[{"anonymous":false,"inputs":[{"indexed":true,"internalType":"address","name":"token","type":"address"},{"indexed":false,"internalType":"uint64","name":"at","type":"uint64"}],"name":"CurveReopened","type":"event"},{"anonymous":false,"inputs":[{"indexed":true,"internalType":"address","name":"token","type":"address"},{"indexed":false,"internalType":"bytes32","name":"poolId","type":"bytes32"},{"indexed":false,"internalType":"uint160","name":"sqrtPriceX96","type":"uint160"},{"indexed":false,"internalType":"uint128","name":"quoteDeposited","type":"uint128"},{"indexed":false,"internalType":"uint256","name":"tokensDeposited","type":"uint256"},{"indexed":false,"internalType":"uint256","name":"positionTokenId","type":"uint256"},{"indexed":false,"internalType":"uint128","name":"quoteResidual","type":"uint128"},{"indexed":false,"internalType":"uint256","name":"tokenResidual","type":"uint256"},{"indexed":false,"internalType":"uint64","name":"at","type":"uint64"}],"name":"Graduated","type":"event"},{"anonymous":false,"inputs":[{"indexed":true,"internalType":"address","name":"token","type":"address"},{"indexed":false,"internalType":"uint64","name":"at","type":"uint64"}],"name":"GraduationPending","type":"event"},{"anonymous":false,"inputs":[{"indexed":true,"internalType":"address","name":"token","type":"address"},{"indexed":true,"internalType":"address","name":"trader","type":"address"},{"indexed":true,"internalType":"address","name":"referrer","type":"address"},{"indexed":false,"internalType":"uint8","name":"venue","type":"uint8"},{"indexed":false,"internalType":"uint8","name":"kind","type":"uint8"},{"indexed":false,"internalType":"bool","name":"isBuy","type":"bool"},{"indexed":false,"internalType":"uint128","name":"quoteGross","type":"uint128"},{"indexed":false,"internalType":"uint256","name":"tokenAmount","type":"uint256"},{"indexed":false,"internalType":"uint128","name":"feeTotal","type":"uint128"},{"indexed":false,"internalType":"uint128","name":"feeCreator","type":"uint128"},{"indexed":false,"internalType":"uint128","name":"feeReferrer","type":"uint128"},{"indexed":false,"internalType":"uint128","name":"feePlatform","type":"uint128"},{"indexed":false,"internalType":"uint16","name":"tierFeeBps","type":"uint16"},{"indexed":false,"internalType":"uint16","name":"tierCreatorShareBps","type":"uint16"},{"indexed":false,"internalType":"uint16","name":"snipeTaxBps","type":"uint16"},{"indexed":false,"internalType":"uint160","name":"sqrtPriceX96After","type":"uint160"},{"indexed":false,"internalType":"uint128","name":"realQuoteAfter","type":"uint128"},{"indexed":false,"internalType":"uint256","name":"tokenReserveAfter","type":"uint256"},{"indexed":false,"internalType":"uint128","name":"cumulativeVolumeAfter","type":"uint128"}],"name":"Trade","type":"event"},{"anonymous":false,"inputs":[{"indexed":true,"internalType":"uint256","name":"versusId","type":"uint256"},{"indexed":true,"internalType":"address","name":"token","type":"address"},{"indexed":false,"internalType":"uint8","name":"side","type":"uint8"},{"indexed":false,"internalType":"string","name":"name","type":"string"},{"indexed":false,"internalType":"string","name":"symbol","type":"string"},{"indexed":false,"internalType":"string","name":"uri","type":"string"},{"indexed":false,"internalType":"uint32","name":"economicsId","type":"uint32"},{"indexed":false,"internalType":"address","name":"quoteAsset","type":"address"},{"indexed":false,"internalType":"uint128","name":"virtualQuote","type":"uint128"},{"indexed":false,"internalType":"uint128","name":"graduationQuote","type":"uint128"},{"indexed":false,"internalType":"uint256","name":"totalSupply","type":"uint256"}],"name":"CampCreated","type":"event"},{"anonymous":false,"inputs":[{"indexed":true,"internalType":"uint256","name":"versusId","type":"uint256"},{"indexed":true,"internalType":"address","name":"creator","type":"address"},{"indexed":true,"internalType":"uint32","name":"configId","type":"uint32"},{"indexed":false,"internalType":"address","name":"creatorFeeRecipient","type":"address"},{"indexed":false,"internalType":"address","name":"tokenA","type":"address"},{"indexed":false,"internalType":"address","name":"tokenB","type":"address"},{"indexed":false,"internalType":"uint64","name":"createdAt","type":"uint64"},{"indexed":false,"internalType":"string","name":"title","type":"string"},{"indexed":false,"internalType":"string","name":"description","type":"string"},{"indexed":false,"internalType":"string","name":"category","type":"string"},{"indexed":false,"internalType":"string","name":"socialsJson","type":"string"}],"name":"VersusCreated","type":"event"},{"anonymous":false,"inputs":[{"indexed":true,"internalType":"address","name":"user","type":"address"},{"indexed":true,"internalType":"address","name":"referrer","type":"address"},{"indexed":false,"internalType":"uint64","name":"at","type":"uint64"}],"name":"ReferrerBound","type":"event"}]', topics, `data`) AS `decoded`,
        id, block_number, block_hash, transaction_hash, log_index, address,
        block_timestamp, _gs_op
      FROM korum_deployment_v2_logs

  referral_bindings:
    type: sql
    primary_key: user_wallet
    sql: |
      SELECT CAST(46630 AS BIGINT) AS chain_id,
        lower(address) AS registry_address,
        lower(decoded.event_params[1]) AS user_wallet,
        lower(decoded.event_params[2]) AS referrer_wallet,
        to_timestamp(CAST(decoded.event_params[3] AS BIGINT)) AS bound_at,
        lower(transaction_hash) AS transaction_hash,
        lower(block_hash) AS block_hash, block_number,
        CAST(log_index AS INT) AS log_index, _gs_op
      FROM decoded_korum_events
      WHERE decoded.event_signature = 'ReferrerBound'

  versuses:
    type: sql
    primary_key: versus_id
    sql: |
      SELECT CAST(46630 AS BIGINT) AS chain_id,
        to_u256(decoded.event_params[1]) AS versus_id,
        lower(address) AS factory_address,
        lower(decoded.event_params[2]) AS creator_wallet,
        CAST(decoded.event_params[3] AS BIGINT) AS config_id,
        lower(decoded.event_params[4]) AS creator_fee_recipient,
        lower(decoded.event_params[5]) AS token_a_address,
        lower(decoded.event_params[6]) AS token_b_address,
        to_timestamp(CAST(decoded.event_params[7] AS BIGINT)) AS created_at,
        decoded.event_params[8] AS title,
        decoded.event_params[9] AS description,
        decoded.event_params[10] AS category,
        decoded.event_params[11] AS socials_json,
        lower(transaction_hash) AS transaction_hash,
        lower(block_hash) AS block_hash, block_number,
        CAST(log_index AS INT) AS log_index, _gs_op
      FROM decoded_korum_events
      WHERE decoded.event_signature = 'VersusCreated'

  versus_camps:
    type: sql
    primary_key: token_address
    sql: |
      SELECT CAST(46630 AS BIGINT) AS chain_id,
        to_u256(decoded.event_params[1]) AS versus_id,
        CAST(decoded.event_params[3] AS SMALLINT) AS side,
        lower(decoded.event_params[2]) AS token_address,
        decoded.event_params[4] AS name,
        decoded.event_params[5] AS symbol,
        decoded.event_params[6] AS uri,
        CAST(decoded.event_params[7] AS BIGINT) AS economics_id,
        lower(decoded.event_params[8]) AS quote_asset,
        to_u256(decoded.event_params[9]) AS virtual_eth,
        to_u256(decoded.event_params[10]) AS graduation_eth,
        to_u256(decoded.event_params[11]) AS total_supply,
        to_timestamp(block_timestamp) AS block_timestamp,
        lower(transaction_hash) AS transaction_hash,
        lower(block_hash) AS block_hash, block_number,
        CAST(log_index AS INT) AS log_index, _gs_op
      FROM decoded_korum_events
      WHERE decoded.event_signature = 'CampCreated'
        AND lower(decoded.event_params[8]) = '0x0000000000000000000000000000000000000000'

  camp_trades:
    type: sql
    primary_key: event_id
    sql: |
      SELECT id AS event_id, CAST(46630 AS BIGINT) AS chain_id,
        lower(decoded.event_params[1]) AS token_address,
        lower(decoded.event_params[2]) AS trader_address,
        lower(decoded.event_params[3]) AS referrer_address,
        CAST(decoded.event_params[4] AS SMALLINT) AS venue,
        CAST(decoded.event_params[5] AS SMALLINT) AS kind,
        CAST(decoded.event_params[6] AS BOOLEAN) AS is_buy,
        to_u256(decoded.event_params[7]) AS eth_gross,
        to_u256(decoded.event_params[8]) AS token_amount,
        to_u256(decoded.event_params[9]) AS fee_total,
        to_u256(decoded.event_params[10]) AS fee_creator,
        to_u256(decoded.event_params[11]) AS fee_referrer,
        to_u256(decoded.event_params[12]) AS fee_platform,
        CAST(decoded.event_params[13] AS INT) AS tier_fee_bps,
        CAST(decoded.event_params[14] AS INT) AS tier_creator_share_bps,
        CAST(decoded.event_params[15] AS INT) AS snipe_tax_bps,
        to_u256(decoded.event_params[16]) AS sqrt_price_x96_after,
        to_u256(decoded.event_params[17]) AS real_eth_after,
        to_u256(decoded.event_params[18]) AS token_reserve_after,
        to_u256(decoded.event_params[19]) AS cumulative_volume_after,
        to_timestamp(block_timestamp) AS traded_at,
        lower(transaction_hash) AS transaction_hash,
        lower(block_hash) AS block_hash, block_number,
        CAST(log_index AS INT) AS log_index, _gs_op
      FROM decoded_korum_events
      WHERE decoded.event_signature = 'Trade'

  graduation_pending_events:
    type: sql
    primary_key: event_id
    sql: |
      SELECT id AS event_id, CAST(46630 AS BIGINT) AS chain_id,
        lower(decoded.event_params[1]) AS token_address,
        'graduation_pending' AS event_type, CAST(2 AS SMALLINT) AS curve_status,
        FALSE AS graduation_disabled,
        to_timestamp(CAST(decoded.event_params[2] AS BIGINT)) AS happened_at,
        lower(transaction_hash) AS transaction_hash,
        lower(block_hash) AS block_hash, block_number,
        CAST(log_index AS INT) AS log_index, _gs_op
      FROM decoded_korum_events
      WHERE decoded.event_signature = 'GraduationPending'

  graduated_lifecycle_events:
    type: sql
    primary_key: event_id
    sql: |
      SELECT id AS event_id, CAST(46630 AS BIGINT) AS chain_id,
        lower(decoded.event_params[1]) AS token_address,
        'graduated' AS event_type, CAST(3 AS SMALLINT) AS curve_status,
        FALSE AS graduation_disabled,
        to_timestamp(CAST(decoded.event_params[9] AS BIGINT)) AS happened_at,
        lower(transaction_hash) AS transaction_hash,
        lower(block_hash) AS block_hash, block_number,
        CAST(log_index AS INT) AS log_index, _gs_op
      FROM decoded_korum_events
      WHERE decoded.event_signature = 'Graduated'

  curve_reopened_events:
    type: sql
    primary_key: event_id
    sql: |
      SELECT id AS event_id, CAST(46630 AS BIGINT) AS chain_id,
        lower(decoded.event_params[1]) AS token_address,
        'curve_reopened' AS event_type, CAST(1 AS SMALLINT) AS curve_status,
        TRUE AS graduation_disabled,
        to_timestamp(CAST(decoded.event_params[2] AS BIGINT)) AS happened_at,
        lower(transaction_hash) AS transaction_hash,
        lower(block_hash) AS block_hash, block_number,
        CAST(log_index AS INT) AS log_index, _gs_op
      FROM decoded_korum_events
      WHERE decoded.event_signature = 'CurveReopened'

  camp_curve_lifecycle:
    type: sql
    primary_key: event_id
    sql: |
      SELECT * FROM graduation_pending_events
      UNION ALL
      SELECT * FROM graduated_lifecycle_events
      UNION ALL
      SELECT * FROM curve_reopened_events

  camp_graduations:
    type: sql
    primary_key: token_address
    sql: |
      SELECT CAST(46630 AS BIGINT) AS chain_id,
        lower(decoded.event_params[1]) AS token_address,
        lower(decoded.event_params[2]) AS pool_id,
        to_u256(decoded.event_params[3]) AS sqrt_price_x96,
        to_u256(decoded.event_params[4]) AS eth_deposited,
        to_u256(decoded.event_params[5]) AS tokens_deposited,
        to_u256(decoded.event_params[6]) AS position_token_id,
        to_u256(decoded.event_params[7]) AS eth_residual,
        to_u256(decoded.event_params[8]) AS token_residual,
        to_timestamp(CAST(decoded.event_params[9] AS BIGINT)) AS graduated_at,
        lower(transaction_hash) AS transaction_hash,
        lower(block_hash) AS block_hash, block_number,
        CAST(log_index AS INT) AS log_index, _gs_op
      FROM decoded_korum_events
      WHERE decoded.event_signature = 'Graduated'

sinks:
  referral_bindings_postgres:
    type: postgres
    from: referral_bindings
    schema: indexer_v2
    table: referral_bindings
    secret_name: KORUM_STAGING_RAILWAY_POSTGRES
    primary_key: chain_id,user_wallet

  versuses_postgres:
    type: postgres
    from: versuses
    schema: indexer_v2
    table: versuses
    secret_name: KORUM_STAGING_RAILWAY_POSTGRES
    primary_key: chain_id,versus_id

  versus_camps_postgres:
    type: postgres
    from: versus_camps
    schema: indexer_v2
    table: versus_camps
    secret_name: KORUM_STAGING_RAILWAY_POSTGRES
    primary_key: chain_id,versus_id,side

  camp_trades_postgres:
    type: postgres
    from: camp_trades
    schema: indexer_v2
    table: camp_trades
    secret_name: KORUM_STAGING_RAILWAY_POSTGRES
    primary_key: chain_id,transaction_hash,log_index

  camp_curve_lifecycle_postgres:
    type: postgres
    from: camp_curve_lifecycle
    schema: indexer_v2
    table: camp_curve_lifecycle
    secret_name: KORUM_STAGING_RAILWAY_POSTGRES
    primary_key: chain_id,transaction_hash,log_index

  camp_graduations_postgres:
    type: postgres
    from: camp_graduations
    schema: indexer_v2
    table: camp_graduations
    secret_name: KORUM_STAGING_RAILWAY_POSTGRES
    primary_key: chain_id,token_address
